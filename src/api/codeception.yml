namespace: Tests
support_namespace: Support
#params:
#    - ../.env
#    - /var/www/html/.env
#params:
#    - /var/www/html/api/config/test-local.php
# не разобрался, как подключить из вне test-local.php или .env
paths:
    tests: tests
    output: tests/_output
    data: tests/Support/Data
    support: tests/Support
    envs: tests/_envs
actor_suffix: Tester
extensions:
    enabled:
        - Codeception\Extension\RunFailed
modules:
    config:
        Yii2:
            configFile: 'config/codeception-local.php'
#settings:
#    colors: true
#    error_level: "E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED"
bootstrap: _bootstrap.php